<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Movie Diary</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body class="bg-dark text-light">

<nav class="navbar navbar-expand-md navbar-dark bg-black border-bottom border-secondary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">Movie Diary</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="{{ url_for('home') }}">Home</a>
            <a class="nav-link" href="{{ url_for('login') }}">Login</a>
        </div>
    </div>
</nav>

<main class="container py-5">
    <div class="row justify-content-center align-items-center g-4">
        <div class="col-md-6">
            <div class="p-4 p-lg-5 border border-secondary rounded-4 bg-black">
                <p class="text-uppercase text-secondary small mb-2">Create account</p>
                <h1 class="display-6 fw-bold">Start your movie diary</h1>
                <p class="text-secondary">
                    Create an account to save watched movies and build your profile.
                </p>
            </div>
        </div>

        <div class="col-md-5">
            <div class="card bg-black text-light border-secondary rounded-4">
                <div class="card-body p-4">
                    <h2 class="h4 mb-3">Sign up</h2>

                    <form method="POST" action="{{ url_for('signup') }}">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input id="username" name="username" type="text" class="form-control"
                                   placeholder="Choose a username" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input id="email" name="email" type="email" class="form-control"
                                   placeholder="you@example.com" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input id="password" name="password" type="password" class="form-control"
                                   placeholder="Create password" required>
                        </div>

                        <button type="submit" class="btn btn-light w-100">Create Account</button>
                    </form>

                    <p class="mt-3 mb-0 text-secondary">
                        Already have an account? <a class="text-light" href="{{ url_for('login') }}">Log in</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
