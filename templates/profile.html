<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | Movie Diary</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="bg-dark text-light">

<nav class="navbar navbar-expand-md navbar-dark bg-black border-bottom border-secondary">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">Movie Diary</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#profileNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="profileNav">
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{{ url_for('home') }}">Home</a>
                <a class="nav-link" href="{{ url_for('diary') }}">Diary</a>
                <a class="nav-link active" href="{{ url_for('profile') }}">Profile</a>
                <a class="nav-link" href="{{ url_for('about') }}">About</a>
                <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
            </div>
        </div>
    </div>
</nav>

<main class="container py-5">
    <section class="card bg-black text-light border-secondary rounded-4 mb-4">
        <div class="card-body p-4">
            <p class="text-uppercase text-secondary small mb-2">Profile</p>
            <h1 class="display-6 fw-bold mb-2">{{ user.username }}</h1>
            <p class="text-secondary mb-0">{{ user.email }}</p>
        </div>
    </section>

    <section class="row g-4">
        <div class="col-md-6">
            <div class="card bg-black text-light border-secondary rounded-4 h-100">
                <div class="card-body p-4">
                    <h2 class="h5">Recently Watched</h2>
                    <ul class="list-group list-group-flush mt-3">
                        <li class="list-group-item bg-black text-light border-secondary">Dune: Part Two</li>
                        <li class="list-group-item bg-black text-light border-secondary">Inception</li>
                        <li class="list-group-item bg-black text-light border-secondary">The Dark Knight</li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card bg-black text-light border-secondary rounded-4 h-100">
                <div class="card-body p-4">
                    <h2 class="h5">Want to Watch</h2>
                    <ul class="list-group list-group-flush mt-3">
                        <li class="list-group-item bg-black text-light border-secondary">Interstellar</li>
                        <li class="list-group-item bg-black text-light border-secondary">Oppenheimer</li>
                    </ul>
                </div>
            </div>
        </div>
    </section>
</main>

<footer class="border-top border-secondary py-3 text-center text-secondary">
    <p class="mb-0">Movie Diary Project</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
